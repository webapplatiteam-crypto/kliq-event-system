<style>

  .cards5.mini { flex:0 0 auto; gap:1vw; min-height:0 } .cards5.mini .scard { padding-bottom:1.2vh; gap:.4vh; border-radius:16px } .cards5.mini .scard img { height:7vh }

  .cards5.mini .scard .tg:nth-of-type(1) { display:none } .cards5.mini .stamp { font-size:clamp(14px,1.5vw,26px) }
  .spot { border-color:var(--gold) !important; transform:scale(1.06) !important; box-shadow:0 0 70px rgba(201,160,99,.75), inset 0 0 0 2px rgba(255,255,255,.25); z-index:2 }

  @keyframes shake { 10%,90% { transform:translate3d(-2px,0,0) rotate(-1deg) } 20%,80% { transform:translate3d(4px,0,0) rotate(1.5deg) } 30%,50%,70% { transform:translate3d(-8px,0,0) rotate(-2deg) } 40%,60% { transform:translate3d(8px,0,0) rotate(2deg) } }

           font-size:clamp(22px,2.6vw,48px); font-weight:600; letter-spacing:.25em; text-transform:uppercase; opacity:0; background:rgba(0,0,0,.35); backdrop-filter:blur(2px); z-index:3; pointer-events:none;
           animation:stampin .45s cubic-bezier(.2,1.4,.4,1) forwards }

  .mbox .pz { font-size:min(3.6vw,6.5vh); color:var(--gold); line-height:1.2 } .mbox .pd { font-size:min(1.5vw,2.8vh); color:var(--ink2) }

  .mi.ph { display:flex; align-items:center; justify-content:center; background:radial-gradient(circle at 50% 40%,#3A3024,#1A1612); color:var(--gold); font-size:min(10vw,18vh); font-weight:300; letter-spacing:4px }
  .mright { display:flex; flex-direction:column; align-items:center; gap:1.2vh; min-width:0; text-align:center }
  .mbox .pz { max-width:100% } .mbox .pd { max-width:100% }

  .li { width:min(3.6vw,6vh); height:min(3.6vw,6vh); object-fit:cover; border-radius:12px; background:#fff; flex:none }
  .mbox .tk { font-size:min(15vw,35vh); font-weight:300; letter-spacing:.06em; line-height:1; color:#fff }
  .mbox .nm { font-size:min(5vw,8vh); line-height:1.15 }
  .ring { position:relative; width:min(13vw,21vh); height:min(13vw,21vh) }
  .ring svg { width:100%; height:100%; transform:rotate(-90deg) } .ring circle { fill:none; stroke-width:8 }
  .ring .bg { stroke:rgba(255,255,255,.12) } .ring .fg { stroke:var(--gold); stroke-linecap:round; transition:stroke-dashoffset 1s linear, stroke .4s }
  .ring b { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:min(5vw,9vh); font-weight:400; font-variant-numeric:tabular-nums }
  .ring.late .fg { stroke:#E54848 } .ring.late b { color:#E54848; animation:blink .6s steps(2) infinite } @keyframes blink { to { opacity:.3 } }
  .mbtns { display:flex; gap:16px; flex-wrap:wrap; justify-content:center; margin-top:.5vh } .mbtns .stagebtn { font-size:min(1.8vw,3.4vh); min-height:min(5.5vw,9vh); padding:0 3vw }
  .mbtns .stagebtn.no { background:transparent; border:1px solid #E54848; color:#E54848 }
  .mbox .hint { font-size:min(1vw,1.8vh); color:var(--ink4) }
  /* เอฟเฟกต์ */
  #confetti { position:fixed; inset:0; pointer-events:none; z-index:50 }
  #headline.drum { animation:drum .5s ease-in-out infinite alternate; color:var(--gold) }
  @keyframes drum { from { opacity:.6; letter-spacing:0 } to { opacity:1; letter-spacing:2px } }
  /* หน้าผลลัพธ์ "ยินดีด้วย": แสงรัศมีหมุน + ประกายดาว + ตัวเลขทองวิบวับ · ปุ่มไปต่อย่อลงไว้ล่างสุด */
  .mbox.won { overflow:hidden; background:radial-gradient(ellipse at 50% 40%,#3B3222 0%,#171410 60%,#0B0A08 100%) }
  .mbox.won .rays { position:absolute; left:50%; top:50%; width:260vmax; height:260vmax; transform:translate(-50%,-50%); z-index:0; pointer-events:none; opacity:.55;
    background:repeating-conic-gradient(from 0deg, rgba(201,160,99,0) 0deg 9deg, rgba(201,160,99,.22) 9deg 12deg, rgba(201,160,99,0) 12deg 18deg); animation:rays 60s linear infinite; mask:radial-gradient(circle, #000 0%, rgba(0,0,0,.6) 35%, transparent 62%); -webkit-mask:radial-gradient(circle, #000 0%, rgba(0,0,0,.6) 35%, transparent 62%) }
  @keyframes rays { to { transform:translate(-50%,-50%) rotate(360deg) } }
  .mbox.won .mgrid { position:relative; z-index:1 }
  .mbox.won .mi { animation:miglow 1.6s ease-in-out infinite alternate, popin .6s cubic-bezier(.2,1.3,.4,1) } @keyframes miglow { from { box-shadow:0 0 0 10px rgba(201,160,99,.15), 0 0 60px rgba(201,160,99,.35) } to { box-shadow:0 0 0 14px rgba(201,160,99,.28), 0 0 140px rgba(201,160,99,.75) } }
  .mbox.won .tk { background:linear-gradient(100deg,#fff 0%,#F7E7C3 30%,#C9A063 50%,#FFF3D6 70%,#fff 100%); background-size:250% 100%; -webkit-background-clip:text; background-clip:text; color:transparent; animation:shine 2.4s linear infinite; filter:drop-shadow(0 0 30px rgba(201,160,99,.45)) }
  @keyframes shine { from { background-position:200% 0 } to { background-position:-50% 0 } }
  .mbox.won .wintag { font-size:min(2.6vw,4.6vh); letter-spacing:.35em; color:var(--gold); font-weight:500; animation:popin .7s cubic-bezier(.2,1.3,.4,1) }
  .mbox.won .nm { animation:popin .8s cubic-bezier(.2,1.3,.4,1) }
  .spark { position:absolute; width:10px; height:10px; border-radius:50%; background:radial-gradient(circle,#fff 0%,#F2D59A 40%,transparent 70%); pointer-events:none; z-index:2; animation:spark 2.2s ease-in-out infinite; opacity:0 }

  .gonext { position:absolute; left:50%; bottom:2.2vh; transform:translateX(-50%); z-index:3; font-size:min(1vw,1.9vh); color:var(--ink4); letter-spacing:2px; cursor:pointer; opacity:.75; background:none; border:1px solid rgba(255,255,255,.12); border-radius:999px; padding:.6vh 1.6vw; animation:none }

  .snd { position:fixed; right:18px; bottom:18px; width:44px; height:44px; border-radius:22px; border:1px solid var(--goldline); background:rgba(0,0,0,.5); color:var(--gold); font-size:18px; cursor:pointer; z-index:60 }

<script>
(async function () {
  const { $, rpc, msg, esc, STAFF, toast, seriesImg, inkFor, qrSvg } = K;
  const me = await STAFF.guard(['mc']);
  if (!me) return;
  let draw = null, prizes = [], claimSec = 60, working = false, timer = null, justSpun = false;   // justSpun: ป๊อปอัปเปิดต่อจากวงล้อในเครื่องนี้ → เริ่มนับ 30 วิเต็มตอนป๊อปอัปขึ้น
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const prizeById = id => prizes.find(p => p.id === id) || {};
  const prizesOf = r => prizes.filter(p => p.rank === r);
  const prizeOf = r => prizesOf(r)[0] || {};
  const prizeName = r => prizesOf(r).map(p => p.name).join(' + ') || ('รางวัลที่ ' + r);
  const prizeLabel = z => !z ? '' : `รางวัลที่ ${z.rank}` + (z.of > 1 ? ` (ชิ้นที่ ${z.seq}/${z.of})` : '');
  const imgTag = (src, cls) => src ? `<img class="${cls}" src="${src}" alt="">` : '';
  const OPEN_KIND = [null, 'out', 'in', 'in', 'out', 'in'];        // ผลของการเปิดใบที่ 1..5 (ล็อกตามกติกา · สุ่มว่าใบไหน)

  // ---------- เสียง (สร้างด้วย WebAudio ไม่ต้องมีไฟล์) ----------

        </div>
      </div>
      <div class="hint">Space/Enter = อยู่ในงาน · N = ไม่อยู่ หมุนใหม่ · ถ้าไม่อยู่ สิทธิ์ของท่านนี้จะถูกตัดและสุ่มใหม่จากผู้ถือการ์ด ${esc(winName)}</div>
    </div></div>`;
    const upd = () => { const leftS = Math.max(0, Math.ceil(total - (Date.now() - startAt) / 1000)); const cd = $('#cd'); if (!cd) return; cd.textContent = leftS;
      $('#ringfg').style.strokeDashoffset = C * (1 - leftS / total);
      if (leftS <= 0) { $('#ring').classList.add('late'); cd.textContent = 'หมดเวลา'; cd.style.fontSize = 'clamp(16px,1.6vw,28px)'; clearInterval(timer); thud(); }
      else if (leftS <= 10) beep(); };
    upd(); timer = setInterval(upd, 1000);
    $('#yes').onclick = () => claim(true); $('#no').onclick = () => claim(false);
  }
  // ย่อ/ขยายวงล้อให้พอดีกับพื้นที่ที่เหลือ ไม่ให้หน้าเลื่อน
  function fitWheel() { const w = document.querySelector('.wheelwrap'), b = $('#wheelbox'); if (!w || !b || b.closest('.spinstage')) return; const s = Math.max(240, Math.min(w.clientHeight - 6, innerWidth * .5, innerHeight * .72)); b.style.width = b.style.height = s + 'px'; }
  addEventListener('resize', fitWheel);
  document.addEventListener('click', e => { if (e.target.closest('.gonext') && modalNext) { const f = modalNext; modalNext = null; f(); } });
  function closeModal() { clearInterval(timer); $('#modal').hidden = true; $('#modal').innerHTML = ''; }
  function clearSpinStage() { document.querySelectorAll('.spinstage').forEach(e => e.remove()); }

  async function claim(present) {
    if (working || !draw || !draw.pending) return;
    working = true; $('#yes').disabled = $('#no').disabled = true; clearInterval(timer);
    const pd = draw.pending;
    const r = await rpc('final_claim', { p_token: me.token, p_draw_id: draw.id, p_present: present }, { tries: 1 });
    if (!r || !r.ok) { working = false; $('#yes').disabled = $('#no').disabled = false; toast(msg(r), 'err'); return; }
    const box = document.querySelector('.mbox');
    ['.ring', '.mbtns', '.hint', '.mright > div[style]'].forEach(q => { const e = box.querySelector(q); if (e) e.remove(); });
    if (present) {
      box.classList.add('won'); box.insertAdjacentHTML('afterbegin', '<div class="rays"></div>');
      box.querySelector('.eyebrow').textContent = 'CONGRATULATIONS'; box.querySelector('.pz').textContent = `ยินดีด้วย! รับ ${pd.prize || prizeName(pd.rank)}`;
      const mr = box.querySelector('.mright'); if (mr) mr.insertAdjacentHTML('afterbegin', '<div class="wintag">★ WINNER ★</div>');
      sparkle(box);
      if (pd.rank === 1) { fanfare(); whiteout(); confetti(420, true); setTimeout(() => confetti(300, true), 700); setTimeout(() => confetti(300, true), 1600); } else { sting(); confetti(220, true); setTimeout(() => confetti(120, true), 500); }
      await sleep(pd.rank === 1 ? 2600 : 1600);
    } else {
      box.querySelector('.eyebrow').textContent = 'NO SHOW'; box.querySelector('.pz').textContent = 'ไม่อยู่ในงาน · ตัดสิทธิ์ แล้วหมุนใหม่'; thud(); await sleep(900);
    }
    // ค้างหน้านี้ไว้จนกว่าพิธีกรจะกด Space (ไม่ไปต่อเอง)
    box.insertAdjacentHTML('beforeend', '<div class="gonext">กด Space เพื่อไปต่อ</div>');
    working = false; await new Promise(res => { modalNext = res; });
    closeModal(); draw = r.draw; prizes = r.prizes || prizes; render();
  }
  let modalNext = null;

  // ---------- ขั้นตอนหลัก (ปุ่ม / Space) ----------
  let load = async function () {
    const [r, info] = await Promise.all([rpc('final_state', { p_token: me.token }), rpc('event_info', {})]);
    if (!r || !r.ok) { toast(msg(r), 'err'); return; }
    prizes = r.prizes; draw = r.draw; claimSec = r.claim_sec || 60;
    K._series = (info && info.series || []).map(s => Object.assign({ out: false, in: false }, s));
    render();
  };

  async function step() {
    if (working || (draw && (draw.done || draw.pending))) return;
    working = true; $('#go').disabled = true;
    const r = draw ? await rpc('final_next', { p_token: me.token, p_draw_id: draw.id }, { tries: 1 })
                   : await rpc('final_create', { p_token: me.token }, { tries: 1 });
    if (r && r.ok && r.draw) {
      const prev = draw; prizes = r.prizes || prizes;
      try { await animate(prev, r.draw); } catch (e) { console.warn(e); }
      draw = r.draw; working = false; render(); return;
    }
    working = false; $('#go').disabled = false;
    toast(r && r.code === 'FINAL_DONE' ? 'รางวัลรอบชิงทุกรางวัลมีผู้รับแล้ว · ถ้าต้องการเล่นใหม่ ให้แอดมินยกเลิกสิทธิ์ หรือล้างข้อมูลซ้อมก่อน' : r && r.code === 'NO_FINAL_PRIZE' ? 'ยังไม่ได้ตั้งรางวัลรอบชิงอันดับ ' + (r.rank || 1) + ' ในหน้าแอดมิน'
        : r && r.code === 'NOT_ENOUGH' ? (draw ? 'ผู้ถือการ์ดนี้ถูกเรียกครบทุกคนแล้ว' : 'ยังไม่มีผู้มีสิทธิ์ลุ้น · ต้องมีผู้ลงทะเบียนอย่างน้อย 1 คน (และยังไม่เลยเวลาตัดยอด) ก่อนเริ่มรอบชิง') : r && r.code === 'PENDING' ? 'กรุณายืนยันผู้โชคดีก่อน' : msg(r), 'err');
  }

  async function animate(prev, next) {
    if (!prev) return;
    const $$ = sel => Array.from(document.querySelectorAll(sel));
    if (prev.phase === 'cut' && next.step > prev.step) {       // เปิดการ์ด 1 ใบ (OUT หรือ IN ตามลำดับที่ล็อกไว้ · สุ่มว่าใบไหน)
      const k = next.step;
      const opened = next.series.find(s => s.pos === k); if (!opened) return;
      const kind = opened.out ? 'out' : 'in';   // ผล OUT/IN เอาจากเซิร์ฟเวอร์เสมอ (OPEN_KIND ใช้แค่บอกลำดับ)
      const live = $$('.scard:not(.out):not(.in)'), target = live.find(e => e.dataset.code === opened.code);
      if (!target) return;
      const last = k === 5;
      setHead(`เปิดการ์ดใบที่ ${k} … ใบไหน?`, true); drumroll(last ? 4600 : 3800); riser(last ? 4600 : 3800); await roulette(live, target, last ? 4600 : 3800);
      gong(); setHead('การ์ด ' + opened.name + ' … เข้ารอบ หรือ ตกรอบ?', true); await hold(HOLD_MS);   // ค้างให้พิธีกรพูด
      if (kind === 'out') { setHead('การ์ด ' + opened.name + ' ตกรอบ!'); await eliminate(target); }
      else { setHead('การ์ด ' + opened.name + ' เข้ารอบ!'); await admit(target, 'IN'); }
      if (last) { const ins = next.series.filter(s => s.in); $$('.scard.in').forEach(e => e.classList.add('win')); fanfare(); confetti(360, true);
        setHead('เข้ารอบ 3 การ์ด: ' + ins.map(s => s.name).join(' · ') + ' · ทุกใบมีรางวัล!'); await sleep(4200); }
      return;
    }
    if (prev.phase === 'reveal' && next.next_card) {         // เปิดว่าการ์ด IN ใบไหนเป็นรางวัลนี้
      const r = next.next_rank, np = next.next_prize || {};
      const live = $$('.scard.in:not(.ranked)'), target = live.find(e => e.dataset.code === next.next_card);
      const nm = next.series.find(s => s.code === next.next_card).name;
      if (!target) return;
      if (live.length > 1) { setHead(`รางวัลที่ ${r} · ${prizeName(r)} · การ์ดใบไหน?`, true); drumroll(3600); riser(3600); await roulette(live, target, 3600);
        gong(); setHead(`การ์ด ${nm} … ได้รางวัลที่ ${r} หรือไม่?`, true); await hold(HOLD_MS); }
      else { target.classList.add('spot'); await sleep(600); }
      target.classList.remove('spot'); target.classList.add('flash', 'pick'); const old = target.querySelector('.stamp'); if (old) old.remove(); stamp(target, 'รางวัลที่ ' + r, true); r === 1 ? fanfare() : sting(); confetti(160, true);
      setHead(`รางวัลที่ ${r} · ${prizeName(r)} ไปที่ผู้ถือการ์ด ${nm}!`); await sleep(2600); return;
    }
    if (next.pending && !prev.pending) {                     // หมุนวงล้อ
      const pd = next.pending, np = next.next_prize || {}; setHead(`${prizeLabel(np)} · ${pd.prize || ''} · วงล้อกำลังหมุน…`, true);
      const lad = document.querySelector(`.lad[data-prize="${pd.prize_id}"] .st`); if (lad) lad.textContent = 'กำลังหมุน…';
      await Wheel.spin(pd.ticket_no, `${prizeLabel(np)} · ${pd.prize || ''}`); ding(); shimmer(); confetti(160, true); justSpun = true;
      setHead(`${pd.ticket_no} · กรุณาขึ้นเวที`); await sleep(1600);   // ค้างให้เห็นช่องที่หยุด แล้วค่อยขึ้นหน้ารางวัล
    }
  }

  // หน้า QR ก่อนเริ่ม: แสดงเมื่อยังไม่มีรอบชิง (หรือเปิดด้วย ?qr=1 / กด Q) · กด "ไปต่อ" หรือ Space เพื่อเข้าหน้าลุ้นรางวัล
  const Intro = {
    show() { const u = location.origin + '/'; $('#iqr').innerHTML = qrSvg(u, 800); $('#iurl').textContent = u.replace(/^https?:\/\//, '').replace(/\/$/, ''); $('#intro').hidden = false; },
    hide() { $('#intro').hidden = true; },
    open() { return !$('#intro').hidden; }
  };
  $('#introGo').onclick = () => { Intro.hide(); tick(); };
  const _load = load;
  load = async function () { await _load(); if (!draw || new URLSearchParams(location.search).get('qr') === '1') Intro.show(); };
  $('#go').onclick = () => { $('#go').blur(); if (!releaseHold()) step(); };
  $('#fs').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  document.addEventListener('keydown', e => {
    const modalOpen = !$('#modal').hidden;
    if (Intro.open()) { if (e.code === 'Space' || e.key === 'Enter') { e.preventDefault(); if (!e.repeat) Intro.hide(); } return; }
    if (e.key === 'q' || e.key === 'Q') { if (!working) Intro.show(); return; }
    if (modalOpen) {
      if (modalNext) { if (e.code === 'Space' || e.key === 'Enter') { e.preventDefault(); if (e.repeat) return; const f = modalNext; modalNext = null; f(); } return; }   // หน้าผลลัพธ์: Space = ไปต่อ
      if (e.key === 'Enter' || e.code === 'Space') { e.preventDefault(); if (!e.repeat) claim(true); }   // Space/Enter = อยู่ในงาน มอบรางวัล
      if (e.key === 'n' || e.key === 'N') claim(false); return; }
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
    if (e.code === 'Space' && !typing) { e.preventDefault(); if (e.repeat) return; if (!releaseHold()) step(); return; }   // Space ใช้ได้ทุกที่ ไม่เลื่อนหน้า
    if (e.key === 'Enter' && !typing && releaseHold()) { e.preventDefault(); return; }
    if (e.key === 'f' || e.key === 'F') $('#fs').click();
    if (e.key === 'm' || e.key === 'M') $('#snd').click();
  });
  load();
})();
</script>
</body>
