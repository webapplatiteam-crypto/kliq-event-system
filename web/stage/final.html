<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grand Final | KLIQ Lucky Draw</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@200;300;400;500;600&display=swap">
<link rel="stylesheet" href="/app.css">
<style>
  .track { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end }
  .track span { padding:6px 12px; border-radius:16px; font-size:14px; border:1px solid var(--goldline); color:var(--ink3) }
  .track span.on { background:var(--gold); color:#121212; border-color:var(--gold); font-weight:500 }
  .track span.past { background:var(--raise); color:var(--ink4); border-color:transparent }
  /* การ์ด 5 ใบ */
  .cards5 { display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:1.4vw; flex:1 }
  .scard { position:relative; border-radius:24px; overflow:hidden; display:flex; flex-direction:column; align-items:center; gap:1.2vh; padding-bottom:3vh; transition:all .6s; border:2px solid transparent }
  .scard img { width:100%; height:30vh; object-fit:cover; display:block; transition:filter .6s }
  .scard .nm { font-size:clamp(22px,2.6vw,48px); font-weight:300; letter-spacing:8px; padding-left:8px }
  .scard .tg { font-size:clamp(12px,1vw,18px); letter-spacing:3px; opacity:.85 }
  .scard.out { opacity:.25; transform:scale(.92) } .scard.out img { filter:grayscale(1) }
  .scard.win { border-color:var(--gold); transform:scale(1.05); box-shadow:0 0 90px rgba(201,160,99,.6) }
  .scard.pick { border-color:var(--gold); box-shadow:0 0 60px rgba(201,160,99,.55) }
  .scard.ranked:not(.pick) { opacity:.55 }
  .scard .rkb { position:absolute; top:10px; left:10px; z-index:2; background:var(--gold); color:#121212; font-size:clamp(11px,.9vw,16px); font-weight:500; padding:4px 10px; border-radius:12px; letter-spacing:1px }
  .cards5.mini { flex:0 0 auto; gap:1vw } .cards5.mini .scard { padding-bottom:1.2vh; gap:.4vh; border-radius:16px } .cards5.mini .scard img { height:12vh }
  .cards5.mini .scard .nm { font-size:clamp(14px,1.4vw,24px); letter-spacing:4px } .cards5.mini .scard .tg { font-size:clamp(10px,.8vw,13px); letter-spacing:1px }
  .cards5.mini .scard .tg:nth-of-type(1) { display:none } .cards5.mini .stamp { font-size:clamp(14px,1.5vw,26px) }
  .spot { border-color:var(--gold) !important; transform:scale(1.06) !important; box-shadow:0 0 70px rgba(201,160,99,.75), inset 0 0 0 2px rgba(255,255,255,.25); z-index:2 }
  .scard.spot img { filter:brightness(1.12) }
  .flash { animation:flash .35s ease-out 1 } @keyframes flash { 0% { filter:brightness(2.2) } 100% { filter:brightness(1) } }
  .shake { animation:shake .55s cubic-bezier(.36,.07,.19,.97) both }
  @keyframes shake { 10%,90% { transform:translate3d(-2px,0,0) rotate(-1deg) } 20%,80% { transform:translate3d(4px,0,0) rotate(1.5deg) } 30%,50%,70% { transform:translate3d(-8px,0,0) rotate(-2deg) } 40%,60% { transform:translate3d(8px,0,0) rotate(2deg) } }
  .stamp { position:absolute; left:50%; top:42%; transform:translate(-50%,-50%) rotate(-14deg) scale(3); padding:.3em .8em; border:.18em solid #E54848; color:#E54848; border-radius:.3em;
           font-size:clamp(22px,2.6vw,48px); font-weight:600; letter-spacing:.25em; text-transform:uppercase; opacity:0; background:rgba(0,0,0,.35); backdrop-filter:blur(2px); z-index:3; pointer-events:none;
           animation:stampin .45s cubic-bezier(.2,1.4,.4,1) forwards }
  .stamp.gold { color:var(--gold); border-color:var(--gold); background:rgba(0,0,0,.45) }
  @keyframes stampin { 0% { opacity:0; transform:translate(-50%,-50%) rotate(-14deg) scale(3) } 60% { opacity:1; transform:translate(-50%,-50%) rotate(-12deg) scale(.92) } 100% { opacity:1; transform:translate(-50%,-50%) rotate(-12deg) scale(1) } }
  /* วงล้อ */
  .wheelwrap { flex:1; display:grid; grid-template-columns:minmax(260px,1fr) auto; gap:3vw; align-items:center }
  .ladder { display:flex; flex-direction:column; gap:1.4vh }
  .lad { border-radius:18px; padding:1.6vh 1.4vw; border:1px solid var(--goldline); background:rgba(28,28,28,.85); display:flex; align-items:center; gap:1.2vw; transition:all .5s }
  .lad .r { width:clamp(44px,4vw,72px); height:clamp(44px,4vw,72px); border-radius:50%; border:2px solid var(--goldline); display:flex; align-items:center; justify-content:center; font-size:clamp(18px,1.6vw,30px); font-weight:500; color:var(--gold); flex:none }
  .lad .pz { font-size:clamp(15px,1.3vw,24px) } .lad .wn { font-size:clamp(20px,2vw,40px); font-weight:400; letter-spacing:2px; line-height:1.1 } .lad .st { font-size:clamp(12px,1vw,18px); color:var(--ink3) }
  .lad.now { border-color:var(--gold); box-shadow:0 0 50px rgba(201,160,99,.35) } .lad.now .r { background:var(--gold); color:#121212; border-color:var(--gold) }
  .lad.won { background:linear-gradient(135deg,#C9A063,#E6C78A); color:#121212; border-color:transparent } .lad.won .r { background:#121212; color:var(--gold); border-color:#121212 } .lad.won .st { color:#3A2C14 }
  .lad.first { box-shadow:0 0 90px rgba(201,160,99,.7) }
  .noshow { font-size:clamp(12px,1vw,16px); color:var(--ink4); line-height:1.6 }
  .wheelbox { position:relative; width:min(44vh,36vw); height:min(44vh,36vw); margin:0 auto }
  .wheelbox canvas { width:100%; height:100%; display:block; border-radius:50%; box-shadow:0 0 0 10px #1B1915, 0 0 0 13px var(--gold), 0 0 120px rgba(201,160,99,.35) }
  .wheelbox.idle canvas { animation:idle 40s linear infinite } @keyframes idle { to { transform:rotate(360deg) } }
  .pin { position:absolute; left:50%; top:-26px; transform:translateX(-50%); width:0; height:0; border-left:22px solid transparent; border-right:22px solid transparent; border-top:52px solid var(--gold); filter:drop-shadow(0 4px 8px rgba(0,0,0,.6)); z-index:3 }
  .pin::after { content:''; position:absolute; left:-12px; top:-50px; width:24px; height:24px; border-radius:50%; background:#F2D59A }
  .hub { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:19%; height:19%; border-radius:50%; background:radial-gradient(circle at 35% 35%,#2A2620,#0E0D0B); border:4px solid var(--gold); display:flex; align-items:center; justify-content:center; color:var(--gold); letter-spacing:4px; font-size:clamp(12px,1.2vw,22px); z-index:2 }
  /* ป๊อปอัปผู้โชคดี */
  .modal { position:fixed; inset:0; background:rgba(5,5,5,.86); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; z-index:40; animation:fadein .4s }
  @keyframes fadein { from { opacity:0 } to { opacity:1 } }
  .mbox { width:min(900px,92vw); border-radius:32px; padding:4vh 4vw; text-align:center; background:radial-gradient(ellipse at 50% 0%,#2E2920,#141210); border:1px solid var(--gold); box-shadow:0 0 160px rgba(201,160,99,.45); display:flex; flex-direction:column; align-items:center; gap:1.6vh; animation:popin .55s cubic-bezier(.2,1.3,.4,1) }
  @keyframes popin { from { transform:scale(.6); opacity:0 } to { transform:scale(1); opacity:1 } }
  .mbox .pz { font-size:clamp(20px,2.2vw,40px); color:var(--gold) } .mbox .pd { font-size:clamp(13px,1.1vw,20px); color:var(--ink2) }
  .prow { display:flex; align-items:center; gap:18px; text-align:left } .mi { width:clamp(90px,10vw,160px); height:clamp(90px,10vw,160px); object-fit:cover; border-radius:18px; border:1px solid var(--gold); background:#fff }
  .li { width:clamp(48px,5vw,84px); height:clamp(48px,5vw,84px); object-fit:cover; border-radius:12px; background:#fff; flex:none }
  .mbox .tk { font-size:clamp(64px,9vw,170px); font-weight:300; letter-spacing:8px; line-height:1; color:#fff }
  .mbox .nm { font-size:clamp(22px,2.6vw,48px) }
  .ring { position:relative; width:clamp(110px,12vw,180px); height:clamp(110px,12vw,180px) }
  .ring svg { width:100%; height:100%; transform:rotate(-90deg) } .ring circle { fill:none; stroke-width:8 }
  .ring .bg { stroke:rgba(255,255,255,.12) } .ring .fg { stroke:var(--gold); stroke-linecap:round; transition:stroke-dashoffset 1s linear, stroke .4s }
  .ring b { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:clamp(34px,3.6vw,64px); font-weight:400; font-variant-numeric:tabular-nums }
  .ring.late .fg { stroke:#E54848 } .ring.late b { color:#E54848; animation:blink .6s steps(2) infinite } @keyframes blink { to { opacity:.3 } }
  .mbtns { display:flex; gap:16px; flex-wrap:wrap; justify-content:center; margin-top:1vh }
  .mbtns .stagebtn.no { background:transparent; border:1px solid #E54848; color:#E54848 }
  .mbox .hint { font-size:13px; color:var(--ink4) }
  /* เอฟเฟกต์ */
  #confetti { position:fixed; inset:0; pointer-events:none; z-index:50 }
  #headline.drum { animation:drum .5s ease-in-out infinite alternate; color:var(--gold) }
  @keyframes drum { from { opacity:.6; letter-spacing:0 } to { opacity:1; letter-spacing:2px } }
  .whiteout { position:fixed; inset:0; background:#fff; pointer-events:none; z-index:49; animation:whiteout .7s ease-out forwards }
  @keyframes whiteout { 0% { opacity:.95 } 100% { opacity:0 } }
  .snd { position:fixed; right:18px; bottom:18px; width:44px; height:44px; border-radius:22px; border:1px solid var(--goldline); background:rgba(0,0,0,.5); color:var(--gold); font-size:18px; cursor:pointer; z-index:60 }
  .badge { display:inline-flex; align-items:center; gap:12px; border-radius:16px; overflow:hidden; padding-right:18px }
  .badge img { width:72px; height:48px; object-fit:cover }
  @media (max-width: 900px) { .wheelwrap { grid-template-columns:1fr } .wheelbox { width:min(80vw,50vh); height:min(80vw,50vh) } }
</style>
</head>
<body class="stage">
<div class="stagewrap">
  <div class="head">
    <div><div class="eyebrow" style="letter-spacing:6px">KLIQ LAUNCH · GRAND FINAL</div><h1>ลุ้นรางวัลใหญ่ <span style="color:var(--gold)" id="top">iPhone</span></h1></div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:10px"><div class="track" id="track" aria-hidden="true"></div>
      <a href="/stage/index.html" class="muted small">‹ กลับเมนู</a></div>
  </div>
  <div id="headline" style="text-align:center;font-size:clamp(20px,2vw,36px);color:var(--ink)" aria-live="polite"></div>
  <div id="stagebody" style="flex:1;display:flex;flex-direction:column;gap:2vh"></div>
  <div style="display:flex;justify-content:center;gap:14px">
    <button class="stagebtn" id="go" disabled>กำลังโหลด…</button>
    <button class="stagebtn ghost" id="fs">เต็มจอ (F)</button>
  </div>
</div>
<div id="modal" hidden></div>
<canvas id="confetti" aria-hidden="true"></canvas>
<button class="snd" id="snd" title="เปิด/ปิดเสียง (M)" aria-label="เปิด/ปิดเสียง">🔊</button>
<script src="/config.js"></script>
<script src="/app.js"></script>
<script>
(async function () {
  const { $, rpc, msg, esc, STAFF, toast, seriesImg, inkFor } = K;
  const me = await STAFF.guard(['mc']);
  if (!me) return;
  let draw = null, prizes = [], claimSec = 60, working = false, timer = null;
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const prizeOf = r => prizes.find(p => p.rank === r) || {};
  const prizeName = r => prizeOf(r).name || ('รางวัลที่ ' + r);
  const prizeImg = (r, cls) => prizeOf(r).image ? `<img class="${cls}" src="${prizeOf(r).image}" alt="">` : '';

  // ---------- เสียง (สร้างด้วย WebAudio ไม่ต้องมีไฟล์) ----------
  const SND = { on: K.LS.get('kliq_snd') !== '0', ctx: null };
  $('#snd').textContent = SND.on ? '🔊' : '🔇';
  function actx() { if (!SND.on) return null; try { SND.ctx = SND.ctx || new (window.AudioContext || window.webkitAudioContext)(); if (SND.ctx.state === 'suspended') SND.ctx.resume(); return SND.ctx; } catch (e) { return null; } }
  function tone(freq, dur, type, gain, when) { const c = actx(); if (!c) return; const o = c.createOscillator(), g = c.createGain(); o.type = type || 'sine'; o.frequency.value = freq;
    const t = c.currentTime + (when || 0); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain || .25, t + .01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + .05); }
  const tick = () => tone(1400, .05, 'square', .06);
  const thud = () => { tone(110, .35, 'sine', .5); tone(55, .5, 'triangle', .4); };
  const ding = () => { tone(880, .5, 'sine', .3); tone(1320, .7, 'sine', .18, .05); };
  const fanfare = () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .9 - i * .08, 'triangle', .22, i * .13));
  const drumroll = (ms) => { const c = actx(); if (!c) return; const n = Math.floor(ms / 45); for (let i = 0; i < n; i++) tone(140 + Math.random() * 40, .06, 'triangle', .12 + (i / n) * .12, i * .045); };
  const beep = () => tone(990, .12, 'sine', .2);
  $('#snd').onclick = () => { SND.on = !SND.on; K.LS.set('kliq_snd', SND.on ? '1' : '0'); $('#snd').textContent = SND.on ? '🔊' : '🔇'; if (SND.on) tick(); };

  // ---------- เอฟเฟกต์ ----------
  function setHead(t, drum) { const h = $('#headline'); h.textContent = t; h.classList.toggle('drum', !!drum); }
  const cv = $('#confetti'), cx = cv.getContext('2d'); let parts = [], raf = 0;
  function confetti(n, big) {
    cv.width = innerWidth; cv.height = innerHeight;
    const cols = ['#C9A063', '#F2D59A', '#FFFFFF', '#E6C78A', '#8A6A3A'];
    for (let i = 0; i < n; i++) parts.push({ x: innerWidth / 2 + (Math.random() - .5) * innerWidth * (big ? 1 : .5), y: innerHeight * (big ? .2 : .4), vx: (Math.random() - .5) * (big ? 22 : 14), vy: -Math.random() * (big ? 22 : 16) - 4,
      r: 4 + Math.random() * 6, c: cols[i % cols.length], a: Math.random() * Math.PI, va: (Math.random() - .5) * .3, life: 1 });
    if (!raf) loop();
  }
  function loop() { raf = requestAnimationFrame(loop); cx.clearRect(0, 0, cv.width, cv.height);
    parts = parts.filter(p => p.life > 0 && p.y < cv.height + 20);
    for (const p of parts) { p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va; p.life -= .004;
      cx.save(); cx.translate(p.x, p.y); cx.rotate(p.a); cx.globalAlpha = Math.max(0, p.life); cx.fillStyle = p.c; cx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); cx.restore(); }
    if (!parts.length) { cancelAnimationFrame(raf); raf = 0; } }
  function whiteout() { const d = document.createElement('div'); d.className = 'whiteout'; document.body.appendChild(d); setTimeout(() => d.remove(), 800); }
  function stamp(el, text, gold) { const d = document.createElement('div'); d.className = 'stamp' + (gold ? ' gold' : ''); d.textContent = text; el.appendChild(d); }
  async function roulette(els, target, total) {              // ไฟวิ่งไล่การ์ด เร็ว → ช้า → หยุดที่เป้า
    let i = Math.floor(Math.random() * els.length), t = 0, d = 70; const ti = els.indexOf(target);
    while (true) { els.forEach(e => e.classList.remove('spot')); els[i].classList.add('spot'); tick(); t += d; d = 70 + Math.pow(t / total, 2.2) * 620; if (t >= total && i === ti) break; await sleep(d); i = (i + 1) % els.length; }
    await sleep(500);
  }
  async function eliminate(el, text) { el.classList.remove('spot'); el.classList.add('flash'); await sleep(120); el.classList.add('shake'); thud(); stamp(el, text || 'OUT'); await sleep(700); el.classList.remove('shake'); el.classList.add('out'); await sleep(900); }

  // ---------- วงล้อ ----------
  const Wheel = {
    labels: [], rot: 0, canvas: null,
    build(pool) { let l = pool.slice(0, 20); if (l.length && l.length < 6) { while (l.length < 6) l = l.concat(pool.slice(0, 6 - l.length)); } this.labels = l.length ? l : ['—']; this.draw(); },
    ensure(ticket) { if (!this.labels.includes(ticket)) this.labels[Math.floor(Math.random() * this.labels.length)] = ticket; this.draw(); },
    draw() {
      const c = this.canvas; if (!c) return; const S = 1000; c.width = S; c.height = S; const g = c.getContext('2d'), n = this.labels.length, R = S / 2, seg = Math.PI * 2 / n;
      g.clearRect(0, 0, S, S);
      for (let i = 0; i < n; i++) {
        const a0 = -Math.PI / 2 + i * seg, a1 = a0 + seg;
        g.beginPath(); g.moveTo(R, R); g.arc(R, R, R - 4, a0, a1); g.closePath();
        g.fillStyle = i % 2 ? '#1E1B17' : '#2B261F'; g.fill(); g.strokeStyle = 'rgba(201,160,99,.55)'; g.lineWidth = 2; g.stroke();
        g.save(); g.translate(R, R); g.rotate(a0 + seg / 2); g.textAlign = 'right'; g.textBaseline = 'middle';
        g.fillStyle = i % 2 ? '#E6C78A' : '#F2EDE4'; g.font = `300 ${n > 14 ? 40 : 54}px Kanit, sans-serif`; g.fillText(this.labels[i], R - 46, 0); g.restore();
      }
      g.beginPath(); g.arc(R, R, R - 4, 0, Math.PI * 2); g.strokeStyle = '#C9A063'; g.lineWidth = 6; g.stroke();
    },
    async spin(ticket) {                                      // หมุน ~7 วิ แล้วหยุดที่ช่องของผู้โชคดี (ผลสุ่มมาจากเซิร์ฟเวอร์แล้ว)
      this.ensure(ticket); const box = $('#wheelbox'); if (box) box.classList.remove('idle');
      const n = this.labels.length, seg = 360 / n, idx = this.labels.indexOf(ticket);
      const start = ((this.rot % 360) + 360) % 360;
      const landing = (360 - (idx * seg + seg / 2)) + (Math.random() - .5) * seg * .6;   // มุมที่ทำให้ช่อง idx อยู่ใต้เข็มด้านบน
      const target = 360 * (6 + Math.floor(Math.random() * 2)) + ((landing - start + 360) % 360);
      const dur = 7000, t0 = performance.now(); let lastSeg = -1;
      return new Promise(res => { const f = now => { const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3.2); this.rot = start + target * e;
        this.canvas.style.transform = `rotate(${this.rot}deg)`; const cur = Math.floor((((360 - this.rot % 360) % 360) + 360) % 360 / seg); if (cur !== lastSeg) { lastSeg = cur; tick(); }
        if (k < 1) requestAnimationFrame(f); else setTimeout(res, 400); }; requestAnimationFrame(f); });
    }
  };

  // ---------- เรนเดอร์ ----------
  function render() {
    const go = $('#go');
    const p1 = prizes.find(p => p.rank === 1); if (p1) $('#top').textContent = p1.name;
    if (!draw) {
      $('#track').innerHTML = ''; setHead('ทุกคนถือการ์ด KLIQ 1 ใบ · คัดการ์ดออกจนเหลือ 3 ใบ แล้วเปิดการ์ดทีละใบให้รางวัลที่ 3 · 2 · 1');
      $('#stagebody').innerHTML = cardsHTML(K._series || [], false); go.textContent = 'เริ่มรอบชิง'; go.disabled = false; return;
    }
    const ranks = draw.ranks || [], r = draw.next_rank, ph = draw.phase, live = draw.series.filter(s => !s.out).length;
    const labels = ['คัดการ์ด 5 → ' + (5 - draw.cuts)].concat(ranks.map(k => 'รางวัลที่ ' + k));
    const cur = ph === 'cut' ? 0 : r ? 1 + ranks.indexOf(r) : labels.length;
    $('#track').innerHTML = labels.map((l, i) => `<span class="${i === cur && !draw.done ? 'on' : i < cur || draw.done ? 'past' : ''}">${l}</span>`).join('');

    if (ph === 'cut') {
      setHead(draw.step === 0 ? `คัดการ์ดออกทีละใบ จนเหลือ ${5 - draw.cuts} ใบ` : `เหลือการ์ด ${live} ใบ · คัดออกอีก ${draw.cuts - draw.step} ใบ`);
      $('#stagebody').innerHTML = cardsHTML(draw.series, false);
      go.textContent = 'คัดการ์ดออก 1 ใบ'; go.disabled = false; return;
    }
    // รอบรางวัล: การ์ดแถวบน + บันไดรางวัล + วงล้อ
    const card = draw.next_card && draw.series.find(s => s.code === draw.next_card);
    setHead(draw.done ? 'ขอแสดงความยินดีกับผู้โชคดีทุกท่าน!'
      : ph === 'reveal' ? `รางวัลที่ ${r} · ${prizeName(r)} · เปิดการ์ด 1 ใน ${live - ranks.filter(k => k > r).length} ใบที่เหลือ`
      : `รางวัลที่ ${r} · ${prizeName(r)} · ผู้ถือการ์ด ${card.name} ${draw.pool_left} ท่านลุ้น`);
    const won = Object.fromEntries((draw.winners || []).map(w => [w.rank, w]));
    const cardName = k => { const c = draw.series.find(s => s.rank === k); return c ? c.name : ''; };
    $('#stagebody').innerHTML = cardsHTML(draw.series, true) + `
      <div class="wheelwrap">
        <div class="ladder" id="ladder">${ranks.slice().sort((a, b) => a - b).map(k => { const w = won[k]; return `<div class="lad ${w ? 'won' : k === r ? 'now' : ''} ${w && k === 1 ? 'first' : ''}" data-rank="${k}">
            <div class="r">${k}</div>${prizeImg(k, 'li')}<div style="flex:1;display:flex;flex-direction:column;gap:2px"><div class="pz">รางวัลที่ ${k} · ${esc(prizeName(k))}</div>${prizeOf(k).description ? `<div class="st">${esc(prizeOf(k).description)}</div>` : ''}
            ${w ? `<div class="wn">${esc(w.ticket_no)}</div><div class="st">${esc(w.name)} · การ์ด ${esc(cardName(k))} · รับรางวัลแล้ว</div>` : `<div class="st">${k === r ? (ph === 'reveal' ? 'รอเปิดการ์ด' : 'การ์ด ' + esc(card.name) + ' · กำลังจะหมุน') : 'รอ'}</div>`}</div></div>`; }).join('')}
          ${(draw.noshows || []).length ? `<div class="noshow">ไม่อยู่ในงาน (ตัดสิทธิ์): ${draw.noshows.map(x => esc(x.ticket_no)).join(' · ')}</div>` : ''}
        </div>
        <div class="wheelbox idle" id="wheelbox"><div class="pin"></div><canvas id="wheel"></canvas><div class="hub">KLIQ</div></div>
      </div>`;
    Wheel.canvas = $('#wheel'); Wheel.rot = 0; Wheel.build(draw.pool_tickets || []);
    go.textContent = draw.done ? 'ประกาศผลครบแล้ว' : ph === 'reveal' ? `เปิดการ์ดรางวัลที่ ${r}` : `หมุนวงล้อ · รางวัลที่ ${r} · การ์ด ${card.name}`; go.disabled = draw.done;
    if (draw.pending) openModal(draw.pending);
  }

  function cardsHTML(series, mini) {
    const cur = draw && draw.next_card;
    return `<div class="cards5 ${mini ? 'mini' : ''}">${series.map(s => `<div class="scard ${s.out ? 'out' : ''} ${s.rank ? 'ranked' : ''} ${s.code === cur && !draw.done ? 'pick' : ''}" data-code="${esc(s.code)}" style="background:${esc(s.color)};color:${inkFor(s.code)}">
      ${s.rank ? `<div class="rkb">รางวัลที่ ${s.rank}</div>` : ''}
      <img src="${seriesImg(s.code, 'p')}" alt="สวิตช์ KLIQ ${esc(s.name)}"><div class="nm">${esc(s.name)}</div><div class="tg">${esc(s.tagline || '')}</div>
      <div class="tg">${s.out ? 'คัดออกแล้ว' : s.rank ? esc(prizeName(s.rank)) : mini ? (s.holders != null ? s.holders + ' ท่าน' : '') : ''}</div></div>`).join('')}</div>`;
  }

  // ---------- ป๊อปอัปผู้โชคดี + นับถอยหลัง ----------
  function openModal(pd) {
    clearInterval(timer);
    const m = $('#modal'); m.hidden = false;
    const total = claimSec, startAt = pd.at ? new Date(pd.at).getTime() : Date.now();
    const C = Math.round(2 * Math.PI * 54);
    const winName = (draw.series.find(s => s.code === pd.card) || {}).name || '';
    m.innerHTML = `<div class="modal"><div class="mbox">
      <div class="eyebrow" style="letter-spacing:6px">WINNER · รางวัลที่ ${pd.rank}</div>
      <div class="prow">${prizeImg(pd.rank, 'mi')}<div><div class="pz">${esc(pd.prize || prizeName(pd.rank))}</div>${prizeOf(pd.rank).description ? `<div class="pd">${esc(prizeOf(pd.rank).description)}</div>` : ''}</div></div>
      <div class="tk">${esc(pd.ticket_no)}</div>
      <div class="nm">${esc(pd.name)}</div>
      <div style="color:var(--ink2)">กรุณาขึ้นมาบนเวทีภายในเวลา</div>
      <div class="ring" id="ring"><svg viewBox="0 0 120 120"><circle class="bg" cx="60" cy="60" r="54"/><circle class="fg" id="ringfg" cx="60" cy="60" r="54" stroke-dasharray="${C}" stroke-dashoffset="0"/></svg><b id="cd">${total}</b></div>
      <div class="mbtns"><button class="stagebtn" id="yes">✓ อยู่ในงาน · มอบรางวัล</button><button class="stagebtn no" id="no">✗ ไม่อยู่ · หมุนใหม่</button></div>
      <div class="hint">Enter = อยู่ในงาน · N = ไม่อยู่ หมุนใหม่ · ถ้าไม่อยู่ สิทธิ์ของท่านนี้จะถูกตัดและสุ่มใหม่จากผู้ถือการ์ด ${esc(winName)}</div>
    </div></div>`;
    const upd = () => { const leftS = Math.max(0, Math.ceil(total - (Date.now() - startAt) / 1000)); const cd = $('#cd'); if (!cd) return; cd.textContent = leftS;
      $('#ringfg').style.strokeDashoffset = C * (1 - leftS / total);
      if (leftS <= 0) { $('#ring').classList.add('late'); cd.textContent = 'หมดเวลา'; cd.style.fontSize = 'clamp(16px,1.6vw,28px)'; clearInterval(timer); thud(); }
      else if (leftS <= 10) beep(); };
    upd(); timer = setInterval(upd, 1000);
    $('#yes').onclick = () => claim(true); $('#no').onclick = () => claim(false);
  }
  function closeModal() { clearInterval(timer); $('#modal').hidden = true; $('#modal').innerHTML = ''; }

  async function claim(present) {
    if (working || !draw || !draw.pending) return;
    working = true; $('#yes').disabled = $('#no').disabled = true; clearInterval(timer);
    const pd = draw.pending;
    const r = await rpc('final_claim', { p_token: me.token, p_draw_id: draw.id, p_present: present }, { tries: 1 });
    if (!r || !r.ok) { working = false; $('#yes').disabled = $('#no').disabled = false; toast(msg(r), 'err'); return; }
    const box = document.querySelector('.mbox');
    ['.ring', '.mbtns', '.hint'].forEach(q => { const e = box.querySelector(q); if (e) e.remove(); });
    if (present) {
      box.querySelector('.eyebrow').textContent = 'CONGRATULATIONS'; box.querySelector('.pz').textContent = `ยินดีด้วย! รับ ${pd.prize || prizeName(pd.rank)}`;
      if (pd.rank === 1) { fanfare(); whiteout(); confetti(420, true); setTimeout(() => confetti(300, true), 700); } else { ding(); confetti(160, true); }
      await sleep(pd.rank === 1 ? 4200 : 2800);
    } else {
      box.querySelector('.eyebrow').textContent = 'NO SHOW'; box.querySelector('.pz').textContent = 'ไม่อยู่ในงาน · ตัดสิทธิ์ แล้วหมุนใหม่'; thud(); await sleep(1600);
    }
    closeModal(); draw = r.draw; prizes = r.prizes || prizes; working = false; render();
  }

  // ---------- ขั้นตอนหลัก (ปุ่ม / Space) ----------
  async function load() {
    const [r, info] = await Promise.all([rpc('final_state', { p_token: me.token }), rpc('event_info', {})]);
    if (!r || !r.ok) { toast(msg(r), 'err'); return; }
    prizes = r.prizes; draw = r.draw; claimSec = r.claim_sec || 60;
    K._series = (info && info.series || []).map(s => Object.assign({ out: false, winner: false }, s));
    render();
  }

  async function step() {
    if (working || (draw && (draw.done || draw.pending))) return;
    working = true; $('#go').disabled = true;
    const r = draw ? await rpc('final_next', { p_token: me.token, p_draw_id: draw.id }, { tries: 1 })
                   : await rpc('final_create', { p_token: me.token }, { tries: 1 });
    if (r && r.ok && r.draw) {
      const prev = draw; prizes = r.prizes || prizes;
      try { await animate(prev, r.draw); } catch (e) { console.warn(e); }
      draw = r.draw; working = false; render(); return;
    }
    working = false; $('#go').disabled = false;
    toast(r && r.code === 'FINAL_DONE' ? 'รอบชิงจบไปแล้ว' : r && r.code === 'NO_FINAL_PRIZE' ? 'ยังไม่ได้ตั้งรางวัลรอบชิงอันดับ ' + (r.rank || 1) + ' ในหน้าแอดมิน'
        : r && r.code === 'NOT_ENOUGH' ? 'ผู้ถือการ์ดนี้ถูกเรียกครบทุกคนแล้ว' : r && r.code === 'PENDING' ? 'กรุณายืนยันผู้โชคดีก่อน' : msg(r), 'err');
  }

  async function animate(prev, next) {
    if (!prev) return;
    const $$ = sel => Array.from(document.querySelectorAll(sel));
    if (prev.phase === 'cut') {                              // คัดการ์ดออก 1 ใบ
      const gone = next.series.find(s => s.out && !prev.series.find(p => p.code === s.code).out); if (!gone) return;
      const live = $$('.scard:not(.out)'), target = live.find(e => e.dataset.code === gone.code);
      const last = next.phase !== 'cut';
      setHead(last ? 'การ์ดใบสุดท้ายที่จะถูกคัดออก…' : 'กำลังคัดการ์ดออก…', true); drumroll(last ? 4600 : 3800); await roulette(live, target, last ? 4600 : 3800);
      setHead('การ์ด ' + gone.name + ' ถูกคัดออก!'); await eliminate(target, 'OUT');
      if (last) { const rest = $$('.scard:not(.out)'); rest.forEach(e => e.classList.add('win')); ding(); confetti(160, true);
        setHead('เหลือ ' + rest.length + ' การ์ด: ' + next.series.filter(s => !s.out).map(s => s.name).join(' · ') + ' · ทุกใบมีรางวัล!'); await sleep(2600); }
      return;
    }
    if (prev.phase === 'reveal' && next.next_card) {         // เปิดการ์ดของรางวัลนี้
      const r = next.next_rank;
      const live = $$('.scard:not(.out):not(.ranked)'), target = live.find(e => e.dataset.code === next.next_card);
      const nm = next.series.find(s => s.code === next.next_card).name;
      if (live.length > 1) { setHead(`รางวัลที่ ${r} · ${prizeName(r)} · การ์ดใบไหน?`, true); drumroll(3600); await roulette(live, target, 3600); }
      else { target.classList.add('spot'); await sleep(600); }
      target.classList.remove('spot'); target.classList.add('flash', 'pick'); stamp(target, 'รางวัลที่ ' + r, true); ding(); confetti(120);
      setHead(`รางวัลที่ ${r} · ${prizeName(r)} ไปที่ผู้ถือการ์ด ${nm}!`); await sleep(2200); return;
    }
    if (next.pending && !prev.pending) {                     // หมุนวงล้อ
      const pd = next.pending; setHead(`รางวัลที่ ${pd.rank} · ${prizeName(pd.rank)} · วงล้อกำลังหมุน…`, true);
      const lad = document.querySelector(`.lad[data-rank="${pd.rank}"] .st`); if (lad) lad.textContent = 'กำลังหมุน…';
      await Wheel.spin(pd.ticket_no); ding(); confetti(90);
      setHead(`${pd.ticket_no} · กรุณาขึ้นเวที`); await sleep(600);
    }
  }

  $('#go').onclick = step;
  $('#fs').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  document.addEventListener('keydown', e => {
    const modalOpen = !$('#modal').hidden;
    if (modalOpen) { if (e.key === 'Enter') { e.preventDefault(); claim(true); } if (e.key === 'n' || e.key === 'N') claim(false); return; }
    if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); step(); }
    if (e.key === 'f' || e.key === 'F') $('#fs').click();
    if (e.key === 'm' || e.key === 'M') $('#snd').click();
  });
  load();
})();
</script>
</body>
</html>
