<script>
(async function () {

  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const prizeById = id => prizes.find(p => p.id === id) || {};

  const prizeLabel = z => !z ? '' : `รางวัลที่ ${z.rank}` + (z.of > 1 ? ` (ชิ้นที่ ${z.seq}/${z.of})` : '');
  const imgTag = (src, cls) => src ? `<img class="${cls}" src="${src}" alt="">` : '';
  const OPEN_KIND = [null, 'out', 'in', 'out', 'in', 'in'];        // ผลของการเปิดใบที่ 1..5 (ล็อกตามกติกา · สุ่มว่าใบไหน)

  // ---------- เสียง (สร้างด้วย WebAudio ไม่ต้องมีไฟล์) ----------
  const SND = { on: K.LS.get('kliq_snd') !== '0', ctx: null, noise: null };
  $('#snd').textContent = SND.on ? '🔊' : '🔇';
  function actx() { if (!SND.on) return null; try { SND.ctx = SND.ctx || new (window.AudioContext || window.webkitAudioContext)(); if (SND.ctx.state === 'suspended') SND.ctx.resume(); return SND.ctx; } catch (e) { return null; } }
  function tone(freq, dur, type, gain, when, opts) { const c = actx(); if (!c) return; opts = opts || {}; const o = c.createOscillator(), g = c.createGain(); o.type = type || 'sine';
    const t = c.currentTime + (when || 0); o.frequency.setValueAtTime(freq, t); if (opts.to) o.frequency.exponentialRampToValueAtTime(opts.to, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain || .25, t + (opts.attack || .01)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    let node = o; if (opts.lp) { const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(opts.lp, t); if (opts.lpTo) f.frequency.exponentialRampToValueAtTime(opts.lpTo, t + dur); o.connect(f); node = f; }
    node.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + .05); }
  function noise(dur, gain, when, opts) {                     // เสียงซ่า/กระทบ (ฉาบ · ระเบิด · ลมพัด)
    const c = actx(); if (!c) return; opts = opts || {}; const t = c.currentTime + (when || 0);
    if (!SND.noise) { const b = c.createBuffer(1, c.sampleRate * 2, c.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; SND.noise = b; }
    const src = c.createBufferSource(); src.buffer = SND.noise; src.loop = true; const f = c.createBiquadFilter(); f.type = opts.type || 'bandpass'; f.frequency.setValueAtTime(opts.f || 3000, t); if (opts.fTo) f.frequency.exponentialRampToValueAtTime(opts.fTo, t + dur); f.Q.value = opts.q || .7;
    const g = c.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain || .2, t + (opts.attack || .01)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f).connect(g).connect(c.destination); src.start(t); src.stop(t + dur + .05); }
  const chord = (freqs, dur, gain, when, type) => freqs.forEach(f => { tone(f, dur, type || 'sawtooth', gain, when, { lp: 2600, attack: .04 }); tone(f * 1.004, dur, type || 'sawtooth', gain * .7, when, { lp: 2200, attack: .04 }); tone(f / 2, dur, 'triangle', gain * .8, when, { attack: .03 }); });
  const tick = () => tone(1400, .05, 'square', .06);
  const thud = () => { tone(110, .35, 'sine', .5); tone(55, .5, 'triangle', .4); };
  const boom = () => { tone(90, 1.1, 'sine', .9, 0, { to: 30 }); tone(45, 1.4, 'triangle', .6, 0, { to: 25 }); noise(.9, .5, 0, { type: 'lowpass', f: 900, fTo: 80 }); noise(.35, .25, 0, { f: 4000, fTo: 600 }); };   // OUT: ระเบิดต่ำ + กระแทก
  const ding = () => { tone(880, .5, 'sine', .3); tone(1320, .7, 'sine', .18, .05); };
  const shimmer = (when) => [1568, 1976, 2349, 2637, 3136, 3520].forEach((f, i) => tone(f, .9, 'sine', .09, (when || 0) + i * .05));
  const cheer = () => { [523, 659, 784, 1047].forEach((f, i) => tone(f, .55, 'triangle', .3, i * .09)); chord([523, 659, 784], 1.6, .12, .35); shimmer(.4); noise(1.2, .18, .3, { f: 7000, fTo: 2000, attack: .02 }); };   // IN: เข้ารอบ
  const fanfare = () => { chord([523, 659, 784], .6, .16, 0); chord([587, 740, 880], .6, .16, .5); chord([659, 784, 988], .7, .17, 1.0); chord([784, 988, 1175, 1568], 2.6, .2, 1.6); shimmer(1.7); shimmer(2.2); noise(2.2, .22, 1.6, { f: 6000, fTo: 1500, attack: .02 }); tone(98, 2.6, 'sine', .5, 1.6); };   // รางวัลใหญ่
  const sting = () => { chord([659, 784, 988], .5, .15, 0); chord([784, 988, 1175], 1.6, .18, .4); shimmer(.45); noise(1.2, .16, .4, { f: 6000, fTo: 1800 }); tone(131, 1.6, 'sine', .4, .4); };   // รางวัลที่ 2–3
  const drumroll = (ms) => { const c = actx(); if (!c) return; const n = Math.floor(ms / 42); for (let i = 0; i < n; i++) { tone(120 + Math.random() * 50, .07, 'triangle', .14 + (i / n) * .2, i * .042); noise(.04, .05 + (i / n) * .12, i * .042, { f: 2500, q: 1.5 }); } };
  const riser = (ms) => { const s = ms / 1000; tone(80, s, 'sawtooth', .07, 0, { to: 900, lp: 400, lpTo: 4000, attack: s * .6 }); noise(s, .22, 0, { f: 300, fTo: 6000, attack: s * .7 }); };   // เสียงไต่ขึ้นเร่งลุ้น
  const gong = () => { [196, 262, 330, 392].forEach((f, i) => tone(f, 3.5, 'sine', .18 - i * .02, 0, { attack: .02 })); tone(98, 3.5, 'triangle', .22, 0); noise(.6, .12, 0, { f: 2000, fTo: 300 }); };   // ค้างรอผล
  const beep = () => tone(990, .12, 'sine', .2);
  $('#snd').onclick = () => { SND.on = !SND.on; K.LS.set('kliq_snd', SND.on ? '1' : '0'); $('#snd').textContent = SND.on ? '🔊' : '🔇'; if (SND.on) tick(); };

  // ---------- เอฟเฟกต์ ----------
  function setHead(t, drum) { const h = $('#headline'); h.textContent = t; h.classList.toggle('drum', !!drum); }
  const cv = $('#confetti'), cx = cv.getContext('2d'); let parts = [], raf = 0;
  function confetti(n, big) {
    cv.width = innerWidth; cv.height = innerHeight;
    const cols = ['#C9A063', '#F2D59A', '#FFFFFF', '#E6C78A', '#8A6A3A'];
    for (let i = 0; i < n; i++) parts.push({ x: innerWidth / 2 + (Math.random() - .5) * innerWidth * (big ? 1 : .5), y: innerHeight * (big ? .2 : .4), vx: (Math.random() - .5) * (big ? 22 : 14), vy: -Math.random() * (big ? 22 : 16) - 4,
      r: 4 + Math.random() * 6, c: cols[i % cols.length], a: Math.random() * Math.PI, va: (Math.random() - .5) * .3, life: 1 });
    if (!raf) loop();
  }
  function loop() { raf = requestAnimationFrame(loop); cx.clearRect(0, 0, cv.width, cv.height);
    parts = parts.filter(p => p.life > 0 && p.y < cv.height + 20);
    for (const p of parts) { p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va; p.life -= .004;
      cx.save(); cx.translate(p.x, p.y); cx.rotate(p.a); cx.globalAlpha = Math.max(0, p.life); cx.fillStyle = p.c; cx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); cx.restore(); }

    await sleep(500);
  }
  // ช่วงลุ้น: ไฟหยุดที่การ์ดแล้ว ค้างไว้ให้พิธีกรพูด (ค่าเริ่มต้น 15 วิ) · กด Space หรือ Enter เพื่อเปิดผลก่อนเวลา
  const HOLD_MS = 15000; let holdResolve = null;
  function hold(ms) { return new Promise(res => { holdResolve = res; const t = setTimeout(() => { holdResolve = null; res(); }, ms); holdResolve._t = t; }); }

  async function eliminate(el) { el.classList.remove('spot'); el.classList.add('flash'); await sleep(120); el.classList.add('shake'); boom(); stamp(el, 'OUT'); await sleep(700); el.classList.remove('shake'); el.classList.add('out'); await sleep(900); }
  async function admit(el, text) { el.classList.remove('spot'); el.classList.add('flash', 'win'); cheer(); stamp(el, text || 'IN', true); confetti(140); await sleep(1500); el.classList.remove('win'); el.classList.add('in'); }

  // ---------- วงล้อ ----------
  const Wheel = {
    labels: [], rot: 0, canvas: null,
    build(pool) { let l = pool.slice(0, 20); if (l.length && l.length < 6) { while (l.length < 6) l = l.concat(pool.slice(0, 6 - l.length)); } this.labels = l.length ? l : ['—']; this.draw(); },
    ensure(ticket) { if (!this.labels.includes(ticket)) this.labels[Math.floor(Math.random() * this.labels.length)] = ticket; this.draw(); },
    draw() {
      const c = this.canvas; if (!c) return; const S = 1000; c.width = S; c.height = S; const g = c.getContext('2d'), n = this.labels.length, R = S / 2, seg = Math.PI * 2 / n;
      g.clearRect(0, 0, S, S);
      for (let i = 0; i < n; i++) {
        const a0 = -Math.PI / 2 + i * seg, a1 = a0 + seg;
        g.beginPath(); g.moveTo(R, R); g.arc(R, R, R - 4, a0, a1); g.closePath();
        g.fillStyle = i % 2 ? '#1E1B17' : '#2B261F'; g.fill(); g.strokeStyle = 'rgba(201,160,99,.55)'; g.lineWidth = 2; g.stroke();
        g.save(); g.translate(R, R); g.rotate(a0 + seg / 2); g.textAlign = 'right'; g.textBaseline = 'middle';
        g.fillStyle = i % 2 ? '#E6C78A' : '#F2EDE4'; g.font = `300 ${n > 14 ? 40 : 54}px Kanit, sans-serif`; g.fillText(this.labels[i], R - 46, 0); g.restore();
      }
      g.beginPath(); g.arc(R, R, R - 4, 0, Math.PI * 2); g.strokeStyle = '#C9A063'; g.lineWidth = 6; g.stroke();
    },
    async spin(ticket) {                                      // หมุน ~7 วิ แล้วหยุดที่ช่องของผู้โชคดี (ผลสุ่มมาจากเซิร์ฟเวอร์แล้ว)
      this.ensure(ticket); const box = $('#wheelbox'); if (box) box.classList.remove('idle');
      const n = this.labels.length, seg = 360 / n, idx = this.labels.indexOf(ticket);
      const start = ((this.rot % 360) + 360) % 360;
      const landing = (360 - (idx * seg + seg / 2)) + (Math.random() - .5) * seg * .6;   // มุมที่ทำให้ช่อง idx อยู่ใต้เข็มด้านบน
      const target = 360 * (6 + Math.floor(Math.random() * 2)) + ((landing - start + 360) % 360);
      const dur = 7000, t0 = performance.now(); let lastSeg = -1; riser(dur * .9);
      return new Promise(res => { const f = now => { const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3.2); this.rot = start + target * e;
        this.canvas.style.transform = `rotate(${this.rot}deg)`; const cur = Math.floor((((360 - this.rot % 360) % 360) + 360) % 360 / seg); if (cur !== lastSeg) { lastSeg = cur; tick(); }
        if (k < 1) requestAnimationFrame(f); else setTimeout(res, 400); }; requestAnimationFrame(f); });
    }
  };

  // ---------- เรนเดอร์ ----------
  function render() {
    const go = $('#go');
    const p1 = prizeOf(1); if (p1.name) $('#top').textContent = p1.name;
    if (!draw) {
      $('#track').innerHTML = ''; setHead('');
      $('#stagebody').innerHTML = cardsHTML(K._series || [], false); go.textContent = 'เริ่มรอบชิง'; go.disabled = false; return;
    }
    const ph = draw.phase, np = draw.next_prize, r = draw.next_rank;
    const finals = prizes.slice().sort((a, b) => a.rank - b.rank || a.id - b.id);
    const order = finals.slice().sort((a, b) => b.rank - a.rank || a.id - b.id);     // ลำดับที่จะหมุน: ที่ 3 #1 → ที่ 3 #2 → ที่ 2 → ที่ 1
    const labels = ['เปิดการ์ด 5 ใบ'].concat(order.map(z => 'รางวัลที่ ' + z.rank + (prizesOf(z.rank).length > 1 ? ' #' + (prizesOf(z.rank).indexOf(z) + 1) : '')));
    const cur = ph === 'cut' ? 0 : np ? 1 + order.findIndex(z => z.id === np.id) : labels.length;
    $('#track').innerHTML = labels.map((l, i) => `<span class="${i === cur && !draw.done ? 'on' : i < cur || draw.done ? 'past' : ''}">${l}</span>`).join('');

    if (ph === 'cut') {
      const k = draw.step + 1;
      setHead(draw.step === 0 ? '' : `เข้ารอบ ${draw.series.filter(s => s.in).length} · ตกรอบ ${draw.series.filter(s => s.out).length}`);
      $('#stagebody').innerHTML = cardsHTML(draw.series, false);
      go.textContent = `เปิดการ์ดใบที่ ${k}`; go.disabled = false; return;
    }
    // รอบรางวัล: การ์ดแถวบน + บันไดรางวัล + วงล้อ
    const card = (draw.next_card && draw.series.find(s => s.code === draw.next_card)) || { name: '' };
    setHead(draw.done ? 'ขอแสดงความยินดีกับผู้โชคดีทุกท่าน!' : `${prizeLabel(np)} · ${np ? np.name : ''} · ผู้ถือการ์ด ${card.name} ${draw.pool_left} ท่านลุ้น`);
    const won = Object.fromEntries((draw.winners || []).map(w => [w.prize_id, w]));
    const cardName = k => { const c = draw.series.find(s => s.rank === k); return c ? c.name : ''; };
    $('#stagebody').innerHTML = cardsHTML(draw.series, true) + `
      <div class="wheelwrap">
        <div class="ladder" id="ladder">${finals.map(z => { const w = won[z.id], now = np && np.id === z.id, many = prizesOf(z.rank).length > 1, seq = prizesOf(z.rank).indexOf(z) + 1; return `<div class="lad ${w ? 'won' : now ? 'now' : ''} ${w && z.rank === 1 ? 'first' : ''}" data-prize="${z.id}">
            <div class="r">${z.rank}</div>${imgTag(z.image, 'li')}<div style="flex:1;display:flex;flex-direction:column;gap:2px"><div class="pz">รางวัลที่ ${z.rank}${many ? ` (ชิ้นที่ ${seq}/${prizesOf(z.rank).length})` : ''} · ${esc(z.name)}</div>${z.description ? `<div class="st">${esc(z.description)}</div>` : ''}
            ${w ? `<div class="wn">${esc(w.ticket_no)}</div><div class="st">${esc(w.name)} · การ์ด ${esc(cardName(z.rank))} · รับรางวัลแล้ว</div>` : `<div class="st">${now ? 'การ์ด ' + esc(card.name) + ' · กำลังจะหมุน' : 'การ์ด ' + esc(cardName(z.rank)) + ' · รอ'}</div>`}</div></div>`; }).join('')}
          ${(draw.noshows || []).length ? `<div class="noshow">ไม่อยู่ในงาน (ตัดสิทธิ์): ${draw.noshows.map(x => esc(x.ticket_no)).join(' · ')}</div>` : ''}
        </div>
        <div class="wheelbox idle" id="wheelbox"><div class="pin"></div><canvas id="wheel"></canvas><div class="hub">KLIQ</div></div>
      </div>`;
    Wheel.canvas = $('#wheel'); Wheel.rot = 0; Wheel.build(draw.pool_tickets || []);
    go.textContent = draw.done ? 'ประกาศผลครบแล้ว' : `หมุนวงล้อ · ${prizeLabel(np)} · การ์ด ${card.name}`; go.disabled = draw.done;
    if (draw.pending) { openModal(draw.pending, justSpun); justSpun = false; }
  }

  function cardsHTML(series, mini) {
    const cur = draw && draw.next_card, spin = draw && draw.phase !== 'cut';
    return `<div class="cards5 ${mini ? 'mini' : ''}">${series.map(s => `<div class="scard ${s.out ? 'out' : ''} ${s.in ? 'in' : ''} ${s.rank && spin ? 'ranked' : ''} ${s.code === cur && !draw.done ? 'pick' : ''}" data-code="${esc(s.code)}" data-pos="${s.pos || ''}" style="background:${esc(s.color)};color:${inkFor(s.code)}">
      ${s.rank && spin ? `<div class="rkb">รางวัลที่ ${s.rank}</div>` : s.in ? `<div class="rkb">IN · เข้ารอบ</div>` : ''}
      ${s.out ? '<div class="stamp still">OUT</div>' : s.in && !spin ? '<div class="stamp gold still">IN</div>' : ''}
      <img src="${seriesImg(s.code, 'p')}" alt="สวิตช์ KLIQ ${esc(s.name)}"><div class="nm">${esc(s.name)}</div><div class="tg">${esc(s.tagline || '')}</div>
      <div class="tg">${s.out ? 'คัดออกแล้ว' : s.rank && spin ? esc(prizeName(s.rank)) : mini ? (s.holders != null ? s.holders + ' ท่าน' : '') : ''}</div></div>`).join('')}</div>`;
  }

  // ---------- ป๊อปอัปผู้โชคดี + นับถอยหลัง ----------
  const WHEEL_MS = 7400;   // เวลาหมุนวงล้อ ใช้ชดเชยเมื่อรีเฟรชหน้าแล้วกลับมาที่ป๊อปอัปเดิม
  function openModal(pd, fresh) {
    clearInterval(timer);
    const m = $('#modal'); m.hidden = false;
    // นับถอยหลังเริ่มตอนป๊อปอัปขึ้น (หลังวงล้อหยุด) ไม่ใช่ตอนกดหมุน · ถ้ารีเฟรชกลับมา ใช้เวลาเซิร์ฟเวอร์ + เวลาหมุน
    const total = claimSec, startAt = fresh || !pd.at ? Date.now() : Math.min(Date.now(), new Date(pd.at).getTime() + WHEEL_MS);
    const C = Math.round(2 * Math.PI * 54);
    const winName = (draw.series.find(s => s.code === pd.card) || {}).name || '';
    const z = Object.assign({}, prizeById(pd.prize_id), draw.next_prize && draw.next_prize.id === pd.prize_id ? draw.next_prize : {});
    m.innerHTML = `<div class="modal"><div class="mbox">
      <div class="eyebrow" style="letter-spacing:6px">WINNER · ${prizeLabel(Object.assign({ rank: pd.rank }, z))}</div>
      <div class="prow">${imgTag(pd.image || z.image, 'mi')}<div><div class="pz">${esc(pd.prize || z.name || prizeName(pd.rank))}</div>${(pd.description || z.description) ? `<div class="pd">${esc(pd.description || z.description)}</div>` : ''}</div></div>
      <div class="tk">${esc(pd.ticket_no)}</div>
      <div class="nm">${esc(pd.name)}</div>
      <div style="color:var(--ink2)">กรุณาขึ้นมาบนเวทีภายในเวลา</div>
      <div class="ring" id="ring"><svg viewBox="0 0 120 120"><circle class="bg" cx="60" cy="60" r="54"/><circle class="fg" id="ringfg" cx="60" cy="60" r="54" stroke-dasharray="${C}" stroke-dashoffset="0"/></svg><b id="cd">${total}</b></div>
      <div class="mbtns"><button class="stagebtn" id="yes">✓ อยู่ในงาน · มอบรางวัล</button><button class="stagebtn no" id="no">✗ ไม่อยู่ · หมุนใหม่</button></div>
      <div class="hint">Enter = อยู่ในงาน · N = ไม่อยู่ หมุนใหม่ · ถ้าไม่อยู่ สิทธิ์ของท่านนี้จะถูกตัดและสุ่มใหม่จากผู้ถือการ์ด ${esc(winName)}</div>
    </div></div>`;
    const upd = () => { const leftS = Math.max(0, Math.ceil(total - (Date.now() - startAt) / 1000)); const cd = $('#cd'); if (!cd) return; cd.textContent = leftS;
      $('#ringfg').style.strokeDashoffset = C * (1 - leftS / total);
      if (leftS <= 0) { $('#ring').classList.add('late'); cd.textContent = 'หมดเวลา'; cd.style.fontSize = 'clamp(16px,1.6vw,28px)'; clearInterval(timer); thud(); }
      else if (leftS <= 10) beep(); };
    upd(); timer = setInterval(upd, 1000);
    $('#yes').onclick = () => claim(true); $('#no').onclick = () => claim(false);
  }
  function closeModal() { clearInterval(timer); $('#modal').hidden = true; $('#modal').innerHTML = ''; }

  async function claim(present) {
    if (working || !draw || !draw.pending) return;
    working = true; $('#yes').disabled = $('#no').disabled = true; clearInterval(timer);
    const pd = draw.pending;
    const r = await rpc('final_claim', { p_token: me.token, p_draw_id: draw.id, p_present: present }, { tries: 1 });
    if (!r || !r.ok) { working = false; $('#yes').disabled = $('#no').disabled = false; toast(msg(r), 'err'); return; }
    const box = document.querySelector('.mbox');
    ['.ring', '.mbtns', '.hint'].forEach(q => { const e = box.querySelector(q); if (e) e.remove(); });
    if (present) {
      box.querySelector('.eyebrow').textContent = 'CONGRATULATIONS'; box.querySelector('.pz').textContent = `ยินดีด้วย! รับ ${pd.prize || prizeName(pd.rank)}`;
      if (pd.rank === 1) { fanfare(); whiteout(); confetti(420, true); setTimeout(() => confetti(300, true), 700); setTimeout(() => confetti(300, true), 1600); } else { sting(); confetti(220, true); setTimeout(() => confetti(120, true), 500); }
      await sleep(pd.rank === 1 ? 5200 : 3200);
    } else {
      box.querySelector('.eyebrow').textContent = 'NO SHOW'; box.querySelector('.pz').textContent = 'ไม่อยู่ในงาน · ตัดสิทธิ์ แล้วหมุนใหม่'; thud(); await sleep(1600);
    }
    closeModal(); draw = r.draw; prizes = r.prizes || prizes; working = false; render();
  }

  // ---------- ขั้นตอนหลัก (ปุ่ม / Space) ----------
  async function load() {
    const [r, info] = await Promise.all([rpc('final_state', { p_token: me.token }), rpc('event_info', {})]);
    if (!r || !r.ok) { toast(msg(r), 'err'); return; }
    prizes = r.prizes; draw = r.draw; claimSec = r.claim_sec || 60;
    K._series = (info && info.series || []).map(s => Object.assign({ out: false, in: false }, s));
    render();
  }

  async function step() {
    if (working || (draw && (draw.done || draw.pending))) return;
    working = true; $('#go').disabled = true;
    const r = draw ? await rpc('final_next', { p_token: me.token, p_draw_id: draw.id }, { tries: 1 })
                   : await rpc('final_create', { p_token: me.token }, { tries: 1 });
    if (r && r.ok && r.draw) {
      const prev = draw; prizes = r.prizes || prizes;
      try { await animate(prev, r.draw); } catch (e) { console.warn(e); }
      draw = r.draw; working = false; render(); return;
    }
    working = false; $('#go').disabled = false;
    toast(r && r.code === 'FINAL_DONE' ? 'รางวัลรอบชิงทุกรางวัลมีผู้รับแล้ว · ถ้าต้องการเล่นใหม่ ให้แอดมินยกเลิกสิทธิ์ หรือล้างข้อมูลซ้อมก่อน' : r && r.code === 'NO_FINAL_PRIZE' ? 'ยังไม่ได้ตั้งรางวัลรอบชิงอันดับ ' + (r.rank || 1) + ' ในหน้าแอดมิน'
        : r && r.code === 'NOT_ENOUGH' ? (draw ? 'ผู้ถือการ์ดนี้ถูกเรียกครบทุกคนแล้ว' : 'ยังไม่มีผู้มีสิทธิ์ลุ้น · ต้องมีผู้ลงทะเบียนอย่างน้อย 1 คน (และยังไม่เลยเวลาตัดยอด) ก่อนเริ่มรอบชิง') : r && r.code === 'PENDING' ? 'กรุณายืนยันผู้โชคดีก่อน' : msg(r), 'err');
  }

  async function animate(prev, next) {
    if (!prev) return;
    const $$ = sel => Array.from(document.querySelectorAll(sel));
    if (prev.phase === 'cut' && next.step > prev.step) {       // เปิดการ์ด 1 ใบ (OUT หรือ IN ตามลำดับที่ล็อกไว้ · สุ่มว่าใบไหน)
      const k = next.step, kind = OPEN_KIND[k];
      const opened = next.series.find(s => s.pos === k); if (!opened) return;
      const live = $$('.scard:not(.out):not(.in)'), target = live.find(e => e.dataset.code === opened.code);
      if (!target) return;
      const last = k === 5;
      setHead(`เปิดการ์ดใบที่ ${k} … ใบไหน?`, true); drumroll(last ? 4600 : 3800); riser(last ? 4600 : 3800); await roulette(live, target, last ? 4600 : 3800);
      gong(); setHead('การ์ด ' + opened.name + ' … เข้ารอบ หรือ ตกรอบ?', true); await hold(HOLD_MS);   // ค้างให้พิธีกรพูด
      if (kind === 'out') { setHead('การ์ด ' + opened.name + ' ตกรอบ!'); await eliminate(target); }
      else { setHead('การ์ด ' + opened.name + ' เข้ารอบ!'); await admit(target, 'IN'); }
      if (last) { const ins = next.series.filter(s => s.in).sort((a, b) => a.rank - b.rank); $$('.scard.in').forEach(e => e.classList.add('win')); fanfare(); confetti(360, true);
        setHead('เข้ารอบ 3 การ์ด: ' + ins.map(s => s.name + ' = รางวัลที่ ' + s.rank).join(' · ')); await sleep(4200); }
      return;
    }
    if (next.pending && !prev.pending) {                     // หมุนวงล้อ
      const pd = next.pending, np = next.next_prize || {}; setHead(`${prizeLabel(np)} · ${pd.prize || ''} · วงล้อกำลังหมุน…`, true);
      const lad = document.querySelector(`.lad[data-prize="${pd.prize_id}"] .st`); if (lad) lad.textContent = 'กำลังหมุน…';
      await Wheel.spin(pd.ticket_no); ding(); shimmer(); confetti(90); justSpun = true;
      setHead(`${pd.ticket_no} · กรุณาขึ้นเวที`); await sleep(600);
    }
  }

  $('#go').onclick = () => { if (!releaseHold()) step(); };
  $('#fs').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  document.addEventListener('keydown', e => {
    const modalOpen = !$('#modal').hidden;
    if (modalOpen) { if (e.key === 'Enter') { e.preventDefault(); claim(true); } if (e.key === 'n' || e.key === 'N') claim(false); return; }
    if ((e.code === 'Space' || e.key === 'Enter') && e.target === document.body && releaseHold()) { e.preventDefault(); return; }
    if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); step(); }
    if (e.key === 'f' || e.key === 'F') $('#fs').click();
    if (e.key === 'm' || e.key === 'M') $('#snd').click();
  });
  load();
})();
</script>
</body>
</html>
