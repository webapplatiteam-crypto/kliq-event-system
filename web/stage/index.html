<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lucky Draw – เลือกรางวัล | KLIQ</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@200;300;400;500;600&display=swap">
<link rel="stylesheet" href="/app.css">
</head>
<body class="stage" style="overflow:auto">
<div class="stagewrap" style="max-width:1100px;margin:0 auto">
  <div class="head">
    <div><div class="eyebrow">KLIQ LAUNCH · LUCKY DRAW</div><h1>เลือกรางวัลที่จะสุ่ม</h1></div>
    <div style="display:flex;gap:10px;align-items:center"><span id="who" class="muted small"></span><button class="stagebtn ghost" id="out" style="min-height:44px;font-size:15px;padding:0 18px">ออก</button></div>
  </div>
  <div id="elig" class="notice"></div>
  <div id="list" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px"></div>
  <p class="muted small" style="margin:0">เปิดหน้าสุ่มบนคอมพิวเตอร์ที่ต่อจอเวที แล้วกด F เพื่อเต็มจอ · ปุ่ม Space = ไปขั้นถัดไป</p>
</div>
<script src="/config.js"></script>
<script src="/app.js"></script>
<script>
(async function () {
  const { $, rpc, msg, esc, STAFF } = K;
  const me = await STAFF.guard(['mc']);
  if (!me) return;
  $('#who').textContent = me.name; $('#out').onclick = () => STAFF.logout();
  const [pz, el] = await Promise.all([rpc('admin_prizes', { p_token: me.token }), rpc('draw_eligible_count', { p_token: me.token })]);
  if (el && el.ok) $('#elig').innerHTML = `ผู้มีสิทธิ์ลุ้นตอนนี้ <b style="color:var(--gold);font-weight:500">${el.eligible}</b> คน · ` +
    el.by_series.map(s => esc(s.name) + ' ' + s.count).join(' · ');
  if (!pz || !pz.ok) { $('#list').innerHTML = `<div class="notice err">${esc(msg(pz))}</div>`; return; }
  const fin = pz.rows.filter(z => z.kind === 'final').sort((a, b) => a.rank - b.rank);
  const finDone = fin.length && fin.every(z => z.won >= 1);
  $('#list').innerHTML = (fin.length ? `<a href="/stage/final.html" class="card" style="text-decoration:none;color:var(--ink);border:1px solid var(--gold);grid-column:1/-1">
    <span class="eyebrow">GRAND FINAL · คัดการ์ด 5 → 3 → เปิดการ์ดทีละใบ → หมุนวงล้อ รางวัลที่ 3 · 2 · 1</span>
    <b style="font-size:30px;font-weight:500">รอบชิงรางวัลใหญ่</b>
    <span class="muted">${fin.map(z => 'ที่ ' + z.rank + ' ' + esc(z.name)).join(' · ')}${finDone ? ' · ประกาศผลแล้ว' : ''}</span></a>` : `<div class="notice err">ยังไม่ได้ตั้งรางวัลรอบชิง ไปที่หลังบ้าน → Lucky Draw</div>`);
})();
</script>
</body>
</html>
