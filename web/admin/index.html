<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ภาพรวม | KLIQ Admin</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@200;300;400;500;600&display=swap">
<link rel="stylesheet" href="/app.css">
</head>
<body class="light">
<div class="layout">
  <nav class="side" id="side" aria-label="เมนูแอดมิน"></nav>
  <main class="main">
    <div class="head">
      <div><h1>ภาพรวมวันงาน</h1><div class="sub" id="upd">กำลังโหลด…</div></div>
      <div class="row"><a class="lbtn" href="/admin/participants.html">ดูรายชื่อ</a><a class="lbtn gold" href="/stage/index.html">เปิดจอ Lucky Draw</a></div>
    </div>
    <div id="state"></div>
    <div class="kpis" id="kpis"></div>
    <div class="cols">
      <section class="lcard"><h2>สิทธิ์ลุ้นตามซีรีส์ <span class="sub" id="quota"></span></h2><div id="series" style="display:flex;flex-direction:column;gap:14px"></div></section>
      <section class="lcard"><h2>ผู้ผ่านแต่ละฐาน</h2><div id="stations"></div></section>
    </div>
  </main>
</div>
<script src="/config.js"></script>
<script src="/app.js"></script>
<script src="/admin/admin.js"></script>
<script>
(async function () {
  const { $, rpc, msg, esc } = K;
  const me = await AdminShell('index', ['mc', 'register', 'souvenir']);
  if (!me) return;
  async function load() {
    const r = await rpc('admin_stats', { p_token: me.token });
    if (!r || !r.ok) { $('#upd').textContent = msg(r); return; }
    const s = r.settings;
    $('#upd').textContent = 'อัปเดตอัตโนมัติทุก 15 วินาที · ล่าสุด ' + new Date().toLocaleTimeString('th-TH');
    const open = s.registration_open && (!s.cutoff_at || new Date(s.cutoff_at) > new Date());
    $('#state').innerHTML = `<div class="lnotice ${open ? 'ok' : ''}">${open ? 'เปิดรับลงทะเบียน' : 'ปิดรับลงทะเบียนแล้ว'}${s.cutoff_at ? ' · ตัดยอดลุ้นโชค ' + K.fmtDateTime(s.cutoff_at) : ' · ยังไม่ได้ตั้งเวลาตัดยอด'}</div>`;
    const k = [
      ['ลงทะเบียนแล้ว (รับการ์ดแล้ว)', r.registered, ' / ' + s.max_participants, 'จากรายชื่อล่วงหน้า ' + r.pre + ' · Walk-in ' + r.walkin],
      ['รายชื่อลงทะเบียนล่วงหน้า', r.preregistered_total, ' คน', 'มาถึงงานแล้ว ' + (r.preregistered_arrived || 0) + ' · ยังไม่มา ' + (r.preregistered_total - (r.preregistered_arrived || 0))],
      ['เริ่มเล่น Exhibition', r.started, ' คน', r.registered ? Math.round(r.started / r.registered * 100) + '% ของผู้ลงทะเบียน' : ''],
      ['ครบทุกฐาน', r.completed, ' คน', r.avg_complete_min != null ? 'เฉลี่ย ' + r.avg_complete_min + ' นาทีต่อคน' : ''],
      ['รับของที่ระลึกแล้ว', r.souvenir, ' คน', 'พิเศษ ' + r.souvenir_premium + ' · ทั่วไป ' + r.souvenir_basic],
      ['ผู้ได้รางวัล', r.winners, ' คน', '', true]
    ];
    $('#kpis').innerHTML = k.map(x => `<div class="kpi ${x[4] ? 'dark' : ''}"><span class="l">${x[0]}</span><span class="v">${x[1]}<small>${x[2]}</small></span><span class="l" style="font-size:13px">${x[3]}</span></div>`).join('');
    $('#quota').textContent = '(ซีรีส์ละ ' + s.series_quota + ')';
    $('#series').innerHTML = r.series.map(x => `<div style="display:flex;flex-direction:column;gap:6px">
      <div style="display:flex;justify-content:space-between"><span>${esc(x.name)}</span><span class="sub">${x.count} / ${s.series_quota}</span></div>
      <div class="bar"><i style="width:${Math.min(100, x.count / s.series_quota * 100)}%;background:${esc(x.color)}"></i></div></div>`).join('');
    $('#stations').innerHTML = r.stations.map((x, i) => `<div style="display:flex;justify-content:space-between;min-height:40px;align-items:center;border-bottom:1px solid #ECE8E1">
      <span>ฐาน ${i + 1} · <span class="sub">${esc(x.name)}${x.active ? '' : ' (ปิด)'}</span></span><b style="font-weight:500">${x.count} คน</b></div>`).join('');
  }
  load(); setInterval(() => { if (!document.hidden) load(); }, 15000);
})();
</script>
</body>
</html>
