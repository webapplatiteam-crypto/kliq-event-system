<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เข้าสู่ระบบเจ้าหน้าที่ | KLIQ</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@200;300;400;500;600&display=swap">
<link rel="stylesheet" href="/app.css">
</head>
<body class="light">
<style>
  body.light { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: radial-gradient(ellipse at 50% 0%, #FBF8F2, #EFEBE3 70%); }
  .login { width: min(400px, 92vw); display: flex; flex-direction: column; gap: 18px; padding: 24px 0 40px; }
  .login .brandbox { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .login .lcard { gap: 14px; padding: 22px; box-shadow: 0 18px 50px rgba(60, 45, 20, .10); }
  .login .lfield { flex: 0 0 auto; }
  .login .lfield .linput { min-height: 50px; font-size: 17px; }
  .login h1 { font-size: 22px; margin: 4px 0 0; }
</style>
<main class="login">
  <div class="brandbox">
    <img src="/assets/logo-black.png" alt="KLIQ — Every Room Simplified" style="width:200px;height:auto">
    <div style="font-size:11px;letter-spacing:4px;color:#8A6A3C">STAFF &amp; ADMIN</div>
    <h1>เข้าสู่ระบบเจ้าหน้าที่</h1>
  </div>
  <form id="f" class="lcard">
    <label class="lfield">รหัสเจ้าหน้าที่<input class="linput" id="code" autocomplete="username" autocapitalize="characters" placeholder="เช่น STAFF01" required></label>
    <label class="lfield">PIN 6 หลัก<input class="linput" id="pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="6" placeholder="••••••" required style="letter-spacing:6px"></label>
    <div id="err" class="lnotice" hidden role="alert"></div>
    <button class="lbtn primary" id="b" type="submit" style="min-height:52px">เข้าสู่ระบบ</button>
  </form>
  <p class="sub" style="text-align:center;margin:0">ลืม PIN? ติดต่อแอดมินประจำงาน · <a href="/" style="color:inherit">กลับหน้าลงทะเบียน</a></p>
</main>
<script src="/config.js"></script>
<script src="/app.js"></script>
<script>
(function () {
  const { $, rpc, msg, busy, STAFF } = K;
  const next = new URLSearchParams(location.search).get('next');
  const cur = STAFF.get();
  if (cur && cur.token) rpc('staff_me', { p_token: cur.token }).then(r => { if (r && r.ok) location.replace(next || STAFF.home(r.role)); });
  $('#f').onsubmit = async e => {
    e.preventDefault();
    busy($('#b'), true);
    const r = await rpc('staff_login', { p_code: $('#code').value, p_pin: $('#pin').value });
    busy($('#b'), false);
    if (r && r.ok) { STAFF.set({ token: r.token, role: r.role, name: r.name, code: r.code }); location.href = (next && next.indexOf('/') === 0 ? next : STAFF.home(r.role)); return; }
    $('#err').hidden = false; $('#err').textContent = msg(r); $('#pin').value = ''; $('#pin').focus();
  };
})();
</script>
</body>
</html>
